        <section class="formulaire-ajout">
            <h3>Consigner une pensée</h3>
            <form id="formNote">
                <input type="text" id="titreNote" placeholder="Titre de la note" required>
                <textarea id="contenuNote" placeholder="Écrivez ici vos découvertes..." rows="4" required></textarea>
                <input type="text" id="tagsNote" placeholder="Mots-clés (séparés par des virgules)">
                <button type="submit">Sceller la note</button>
            </form>
        </section>

        <hr>

        <div style="margin-bottom: 30px;">
            <input type="text" id="searchNotes" placeholder="Filtrer par mot-clé ou titre..." style="border-bottom: 1px solid #e3d3ad;">
        </div>

        <div id="listeNotes" class="grille-notes"></div>
    </div>

    <script src="gestion_notes.js"></script>
