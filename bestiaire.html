        <button id="toggleBestiaire" class="btn-action">◈ Recenser une créature ◈</button>

        <section id="zoneFormBestiaire" class="formulaire-ajout" style="display:none;">
            <h3>Détails de l'entité</h3>
            <form id="formBestiaire">
                <input type="text" id="nomMonstre" placeholder="Nom de la créature" required>
                <select id="dangerMonstre">
                    <option value="Inoffensif">Inoffensif</option>
                    <option value="Mineur">Menace Mineure</option>
                    <option value="Majeur">Menace Majeure</option>
                    <option value="Legendaire">Légendaire / Boss</option>
                </select>
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="pvMonstre" placeholder="Points de Vie (PV)" style="flex:1;">
                    <input type="text" id="habitatMonstre" placeholder="Habitat (ex: Grottes)" style="flex:1;">
                </div>
                <textarea id="capaciteMonstre" placeholder="Capacités spéciales ou faiblesses..."></textarea>
                <button type="submit">Inscrire au Bestiaire</button>
            </form>
        </section>

        <div id="listeBestiaire" class="grille-bestiaire"></div>
    </div>

    <script src="recherche.js"></script>
    <script src="gestion_bestiaire.js"></script>
</body>
