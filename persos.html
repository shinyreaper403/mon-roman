            <input type="text" id="race" placeholder="Race (Velkare, Draekovare...)">

        </div>
        <input type="text" id="imageLink" placeholder="Lien d'une image (URL)">
        <textarea id="bio" placeholder="Chronique du personnage..."></textarea>
        
        <button id="btnAjouter">Inscrire au Grimoire</button>
