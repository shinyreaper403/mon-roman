<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Héros de Velkare - Archives</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grimoire">
        <h1>Registre des Héros</h1>

        <nav class="navigation-velkare">
            <ul>
                <li><a href="index.html">Accueil</a></li>
                <li><a href="persos.html" style="color:#e3d3ad">Héros</a></li>
                <li><a href="bestiaire.html">Bestiaire</a></li>
                <li><a href="lexique.html">Lexique</a></li>
                <li><a href="notes.html">Notes</a></li>
                <li><a href="carte.html">Carte</a></li>
            </ul>
        </nav>

        <button id="toggleFormPerso" class="btn-action">◈ Inscrire un nouveau Héros ◈</button>

        <section id="zoneFormPerso" class="formulaire-ajout" style="display:none;">
            <form id="formPerso">
                <input type="text" id="nom" placeholder="Nom du Héros" required>
                <input type="text" id="role" placeholder="Classe / Titre (ex: Mage de Sang)">
                
                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <select id="lieuPerso" style="flex:1;">
                        <option value="">-- Lieu de naissance --</option>
                    </select>
                    <select id="nemesisPerso" style="flex:1;">
                        <option value="">-- Némésis --</option>
                    </select>
                </div>

                <textarea id="histoire" placeholder="Racontez sa légende..."></textarea>
                <button type="submit">Graver dans les Archives</button>
            </form>
        </section>

        <div id="listePersos" class="grille-persos"></div>

        <div id="modalePerso" class="modal-fiche" style="display:none;">
            <div class="modal-contenu">
                <span class="fermer-modal">&times;</span>
                <div id="detailsPerso"></div>
            </div>
        </div>
    </div>

    <script src="recherche.js"></script>
    <script src="gestion_persos.js"></script>
</body>
</html>
<button onclick="window.print()" class="btn-action">📜 Sceller en PDF (Export)</button>
